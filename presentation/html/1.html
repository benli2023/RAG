<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>打造下一代企业级私有代码RAG系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Source+Code+Pro:wght@400;600;700&family=Roboto+Flex:wght@300;400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<style type="text/tailwindcss">
@layer utilities {
.ppt-slide {
@apply relative w-[1280px] min-h-[720px] mx-auto box-border
}
}
</style>
<style>body {
    font-family: "Noto Sans SC", sans-serif;
    background: #F4F1E9
    }
.title-font {
    font-family: "Noto Sans SC", sans-serif
    }
.code-font {
    font-family: "Source Code Pro", monospace
    }
.body-font {
    font-family: "Roboto Flex", sans-serif
    }</style>
<style>.material-icons {
    width: 1em
    }</style><style>.material-icons {
    direction: rtl
    }</style></head>
<body>
<div class="ppt-slide flex justify-center items-center" style="height: 720px;
background: #F4F1E9">
<div class="absolute inset-0 z-0" style="flex-shrink: 0">
<img alt="Server Room Background" class="w-full h-full object-cover" src="https://sfile.chatglm.cn/image/ab/ab782f40.jpg"/>
<div class="absolute inset-0 bg-gradient-to-br from-red-50/95 via-orange-50/90 to-red-100/95"></div>
</div>

<div class="absolute top-8 right-8 z-10 opacity-10">
<i class="material-icons" style="font-size: 120px;
color: #DC143C">account_tree</i>
</div>
<div class="absolute bottom-8 left-8 z-10 opacity-10">
<i class="material-icons" style="font-size: 100px;
color: #DC143C">security</i>
</div>

<div class="relative z-20 text-center px-20 max-w-5xl">
<div class="mb-8 flex items-center justify-center gap-3">
<i class="material-icons" style="font-size: 56px;
color: #DC143C">code</i>
<i class="material-icons" style="font-size: 56px;
color: #FF6B6B">memory</i>
<i class="material-icons" style="font-size: 56px;
color: #DC143C">storage</i>
</div>

<h1 class="title-font font-black mb-6" style="font-size: 62px;
line-height: 1.2;
letter-spacing: -1px;
color: #DC143C">
让 Copilot 真正懂我们的业务
</h1>

<div class="flex items-center justify-center gap-4 mb-6">
<div class="h-0.5 w-20 bg-gradient-to-r from-transparent via-red-400 to-transparent"></div>
<i class="material-icons" style="font-size: 28px;
color: #DC143C">stars</i>
<div class="h-0.5 w-20 bg-gradient-to-r from-transparent via-red-400 to-transparent"></div>
</div>

<h2 class="title-font mb-8" style="font-size: 42px;
font-weight: 600;
color: #DC143C">
企业级私有 RAG 最佳实践
</h2>

<div class="bg-white/80 backdrop-blur-sm rounded-2xl px-8 py-6 border-2 border-red-200 mb-8 shadow-lg">
<p class="body-font text-2xl leading-relaxed" style="color: #2d3748">
从<span class="code-font font-semibold" style="color: #DC143C">"大杂烩检索"</span>到<span class="code-font font-semibold" style="color: #FF6B6B">"意图路由 + 零信任隔离"</span>
</p>
</div>

<div class="flex items-center justify-center gap-8">
<div class="flex items-center gap-2">
<i class="material-icons" style="font-size: 24px;
color: #DC143C">person</i>
<span class="body-font text-lg" style="color: #2d3748">演讲人：[你的名字/职位]</span>
</div>
<div class="w-px h-6 bg-gray-400"></div>
<div class="flex items-center gap-2">
<i class="material-icons" style="font-size: 24px;
color: #DC143C">business</i>
<span class="body-font text-lg" style="color: #2d3748">企业级知识库实践</span>
</div>
</div>
</div>
</div>
</body>
</html>
